[database]
# The URL itself remains in the host credential file and is never stored here.
url_env = "CRYPTO_CTA_LOCAL_DATABASE_URL"
max_connections = 8

[ingestion]
poll_interval_secs = 60
# Do not scan the newest few seconds while persist_manager may still be writing them.
safety_lag_secs = 5
# Re-read a recent window on every poll; PostgreSQL upserts make this idempotent.
overlap_secs = 300

[order_config]
request_timeout_secs = 5

[redis]
# Host-local Exec runtime Redis. Manager keeps one reconnecting long connection.
url = "redis://127.0.0.1:6379/0"
request_timeout_secs = 2
reconnect_interval_ms = 500

[twap]
enabled = true
# Host-global Manager RocksDB for position-update messages and public BBO TWAP.
# Do not put this under an Exec account.
rocksdb_path = "/home/el01/crypto_cta_manager/db"
venue = "binance-futures"
interval_ms = 5000
retain_days = 30
catalog_reload_secs = 30
compact_interval_secs = 3600

[monitor]
# Standalone cta_monitor checks market BBO, Exec order persistence, and
# Exec pre-trade position execution. Keep the webhook secret in the host
# credential environment, never in TOML.
enabled = false
poll_interval_secs = 10
repeat_alert_secs = 30
market_stale_secs = 5
order_stale_secs = 120
position_stale_secs = 30
execution_grace_secs = 30
recent_order_records = 2000
position_tolerance = 0.00000001
# Unfinished or mismatched position value below this USDT amount is dust and
# does not alert.
position_residual_usdt = 50
# Watched symbols for the market liveness check: one alert fires when none of
# these symbols delivered a new BBO within market_stale_secs. Empty means check
# that the venue feed has any fresh BBO at all. Defaults to the sk traded pairs.
market_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]

[monitor.dingtalk]
market_webhook_url_env = "CTA_DINGTALK_MARKET_WEBHOOK_URL"
order_webhook_url_env = "CTA_DINGTALK_ORDER_WEBHOOK_URL"
# Optional signing secret environment variables for each robot.
# market_secret_env = "CTA_DINGTALK_MARKET_WEBHOOK_SECRET"
# order_secret_env = "CTA_DINGTALK_ORDER_WEBHOOK_SECRET"
request_timeout_secs = 5
retry_attempts = 5
retry_backoff_ms = 1000
at_mobiles = []
is_at_all = false

# POST /api/catalog/position-strategies is gated per strategy. Any one of
# these suffices: an admin session, a session of the strategy's creator or an
# authorized manager (set on the 权限管理 page), or a publish token sent as the
# X-CTA-Publish-Token header. Per-strategy tokens and global fallback tokens
# are stored as SHA-256 hashes in PostgreSQL and managed on the 权限管理 page;
# a strategy without one keeps the legacy open push so existing publishers
# keep working until tokens are assigned. Publishers send a token via
# manager_publish_client.py --token or MANAGER_PUBLISH_TOKEN.

[[sources]]
id = "binance_exec_trade01"
account = "trade01"
# Optional Manager display name. source_id remains the identity.
# alias = "bahll202210"
venue = "binance-futures"
rocksdb_path = "/home/el01/binance_exec_trade01/data/persist_manager"
enabled = true
gateway_prefix = "/exec_trade01"
exec_config_url = "http://127.0.0.1:18161/"
exec_viz_url = "http://127.0.0.1:10041/"
# Effective fee charged per unit of fill notional (4 bps in this example).
estimated_fee_rate = 0.0004
# Iceoryx namespace of this Exec's account_monitor. Defaults to source id.
ipc_namespace = "binance_exec_trade01"
account_ipc_service = "account_pubs/binance_pm"
# Optional Exec env.sh used only to read exchange API credentials for
# GET/PUT /api/catalog/accounts/{source_id}/contract-leverage.
# Defaults to <rocksdb_path>/../../env.sh, for example /home/el01/binance_exec_trade01/env.sh.
# env_path = "/home/el01/binance_exec_trade01/env.sh"
# Omit start_ts_us to backfill all available history on the first run.

# Additional accounts are independent workers with independent checkpoints.
# Keep reserved accounts disabled until that Exec directory and listeners exist.
[[sources]]
id = "binance_exec_trade02"
account = "trade02"
venue = "binance-futures"
rocksdb_path = "/home/el01/binance_exec_trade02/data/persist_manager"
enabled = false
gateway_prefix = "/exec_trade02"
exec_config_url = "http://127.0.0.1:18162/"
exec_viz_url = "http://127.0.0.1:10042/"
estimated_fee_rate = 0.0004
ipc_namespace = "binance_exec_trade02"
account_ipc_service = "account_pubs/binance_pm"

