[database]
# The URL itself remains in the host credential file and is never stored here.
url_env = "CRYPTO_CTA_LOCAL_DATABASE_URL"
max_connections = 8

[ingestion]
poll_interval_secs = 60
# Do not scan the newest few seconds while persist_manager may still be writing them.
safety_lag_secs = 5
# Re-read a recent window on every poll; PostgreSQL upserts make this idempotent.
overlap_secs = 300

[order_config]
request_timeout_secs = 5

[redis]
# Host-local Exec runtime Redis. Manager keeps one reconnecting long connection.
url = "redis://127.0.0.1:6379/0"
request_timeout_secs = 2
reconnect_interval_ms = 500

[twap]
enabled = true
# Host-global Manager RocksDB for position-update messages and public BBO TWAP.
# Do not put this under an Exec account.
rocksdb_path = "/home/el01/crypto_cta_manager/db"
venue = "binance-futures"
interval_ms = 5000
retain_days = 30
catalog_reload_secs = 30
compact_interval_secs = 3600

[[sources]]
id = "binance_exec_trade01"
account = "trade01"
# Optional Manager display name. source_id remains the identity.
# alias = "bahll202210"
venue = "binance-futures"
rocksdb_path = "/home/el01/binance_exec_trade01/data/persist_manager"
enabled = true
gateway_prefix = "/exec_trade01"
exec_config_url = "http://127.0.0.1:18161/"
exec_viz_url = "http://127.0.0.1:10041/"
# Effective fee charged per unit of fill notional (4 bps in this example).
estimated_fee_rate = 0.0004
# Iceoryx namespace of this Exec's account_monitor. Defaults to source id.
ipc_namespace = "binance_exec_trade01"
account_ipc_service = "account_pubs/binance_pm"
# Optional Exec env.sh used only to read exchange API credentials for
# GET/PUT /api/catalog/accounts/{source_id}/contract-leverage.
# Defaults to <rocksdb_path>/../../env.sh, for example /home/el01/binance_exec_trade01/env.sh.
# env_path = "/home/el01/binance_exec_trade01/env.sh"
# Omit start_ts_us to backfill all available history on the first run.

# Additional accounts are independent workers with independent checkpoints.
# Keep reserved accounts disabled until that Exec directory and listeners exist.
[[sources]]
id = "binance_exec_trade02"
account = "trade02"
venue = "binance-futures"
rocksdb_path = "/home/el01/binance_exec_trade02/data/persist_manager"
enabled = false
gateway_prefix = "/exec_trade02"
exec_config_url = "http://127.0.0.1:18162/"
exec_viz_url = "http://127.0.0.1:10042/"
estimated_fee_rate = 0.0004
ipc_namespace = "binance_exec_trade02"
account_ipc_service = "account_pubs/binance_pm"

