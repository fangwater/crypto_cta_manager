[database]
# PostgreSQL stores immutable position snapshots and ingestion checkpoints.
url_env = "CRYPTO_CTA_LOCAL_DATABASE_URL"
max_connections = 8

[ingestion]
poll_interval_secs = 60
safety_lag_secs = 5
overlap_secs = 300

[order_config]
request_timeout_secs = 5

[redis]
url = "redis://127.0.0.1:6379/0"
request_timeout_secs = 2
reconnect_interval_ms = 500

[twap]
enabled = true
# Host-global Manager RocksDB for position-update messages and public BBO TWAP.
rocksdb_path = "/home/el01/crypto_cta_manager/db"
venue = "binance-futures"
interval_ms = 5000
retain_days = 30
catalog_reload_secs = 30
compact_interval_secs = 3600

[monitor]
# Enable only after both webhook URLs are installed in the host EnvironmentFile.
# The process is independently deployed by pmdaemon.
enabled = false
poll_interval_secs = 10
repeat_alert_secs = 30
market_stale_secs = 5
order_stale_secs = 120
position_stale_secs = 30
execution_grace_secs = 30
recent_order_records = 2000
position_tolerance = 0.00000001
position_residual_usdt = 50
# sk traded pairs: alert when none of them delivered a new BBO within
# market_stale_secs. Empty means check the venue feed for any fresh BBO.
market_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]

[monitor.dingtalk]
market_webhook_url_env = "CTA_DINGTALK_MARKET_WEBHOOK_URL"
order_webhook_url_env = "CTA_DINGTALK_ORDER_WEBHOOK_URL"
# Optional signing secrets can be enabled by adding these fields and the
# corresponding variables to the host EnvironmentFile.
# market_secret_env = "CTA_DINGTALK_MARKET_WEBHOOK_SECRET"
# order_secret_env = "CTA_DINGTALK_ORDER_WEBHOOK_SECRET"
request_timeout_secs = 5
retry_attempts = 5
retry_backoff_ms = 1000
at_mobiles = []
is_at_all = false

[[sources]]
id = "binance_exec_trade01"
account = "trade01"
alias = "bahll202210"
venue = "binance-futures"
rocksdb_path = "/home/el01/binance_exec_trade01/data/persist_manager"
enabled = true
gateway_prefix = "/exec_trade01"
exec_config_url = "http://127.0.0.1:18161/"
exec_viz_url = "http://127.0.0.1:10041/"
estimated_fee_rate = 0.0004
ipc_namespace = "binance_exec_trade01"
account_ipc_service = "account_pubs/binance_pm"

