        # Hashed assets must 404 when missing. Falling back to index.html makes
        # stale cached HTML load HTML-as-JS and blank the app after a release.
        location /manager/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location /manager/ {
            try_files $uri $uri/ /manager/index.html;
            add_header Cache-Control "no-cache";
        }

        location = /cta {
            return 308 /manager/;
        }

        location ~ ^/cta/(.*)$ {
            return 308 /manager/$1$is_args$args;
        }

        location /cta-api/ {
            proxy_pass http://cta_manager_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_buffering off;
