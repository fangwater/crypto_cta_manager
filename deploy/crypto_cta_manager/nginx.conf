    server {
        listen 127.0.0.1:10051;
        server_name localhost;
        absolute_redirect off;
        root /home/el01/crypto_cta_manager/webroot;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = / {
            return 308 /manager/workspace/;
        }

        location = /exec_trade01 {
            return 308 /exec_trade01/;
        }

        location /exec_trade01/ {
            auth_request /manager-auth/exec_trade01;
            proxy_pass http://exec_trade01_viz/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_redirect / /exec_trade01/;
        }

        location = /exec_trade02 {
