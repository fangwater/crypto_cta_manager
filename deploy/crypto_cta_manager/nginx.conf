worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 256;
}

http {
    include /home/el01/.local/opt/nginx/current/conf/mime.types;
    default_type application/octet-stream;

    access_log logs/access.log combined;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 1m;

    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream exec_trade01_viz {
        server 127.0.0.1:10041;
        keepalive 4;
    }

    upstream exec_trade02_viz {
        server 127.0.0.1:10042;
        keepalive 4;
    }

    upstream exec_trade03_viz {
        server 127.0.0.1:10043;
        keepalive 4;
    }

    upstream exec_trade04_viz {
        server 127.0.0.1:10044;
        keepalive 4;
    }

    upstream cta_manager_api {
        server 127.0.0.1:18201;
        keepalive 4;
    }

    server {
        listen 127.0.0.1:10051;
        server_name localhost;
        absolute_redirect off;
        root /home/el01/crypto_cta_manager/webroot;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = / {
            return 308 /manager/workspace/;
        }

        location = /exec_trade01 {
            return 308 /exec_trade01/;
        }

        location /exec_trade01/ {
            proxy_pass http://exec_trade01_viz/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_redirect / /exec_trade01/;
        }

        location = /exec_trade02 {
            return 308 /exec_trade02/;
        }

        location /exec_trade02/ {
            proxy_pass http://exec_trade02_viz/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_redirect / /exec_trade02/;
        }

        location = /exec_trade03 {
            return 308 /exec_trade03/;
        }

        location /exec_trade03/ {
            proxy_pass http://exec_trade03_viz/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_redirect / /exec_trade03/;
        }

        location = /exec_trade04 {
            return 308 /exec_trade04/;
        }

        location /exec_trade04/ {
            proxy_pass http://exec_trade04_viz/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_redirect / /exec_trade04/;
        }

        location = /config {
            return 308 /config/;
        }

        location /config/ {
            proxy_pass http://exec_trade01_viz/config/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_buffering off;
        }

        location = /manager {
            return 308 /manager/;
        }

        location /manager/api/ {
            proxy_pass http://cta_manager_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_buffering off;
        }

        location /manager/ {
            try_files $uri $uri/ /manager/index.html;
        }

        location = /cta {
            return 308 /manager/;
        }

        location ~ ^/cta/(.*)$ {
            return 308 /manager/$1$is_args$args;
        }

        location /cta-api/ {
            proxy_pass http://cta_manager_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_buffering off;
        }

        location = /healthz {
            proxy_pass http://cta_manager_api/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
