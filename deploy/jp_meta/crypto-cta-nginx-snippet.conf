# CTA Manager on the existing jp-meta :4191 gateway.
# Included from sites-available/crypto_proxy_4191.conf. Do not replace that site.
# Reserved trade02-04 prefixes return 502 until those Exec listeners exist.

location /manager/api/ {
    proxy_pass http://127.0.0.1:18201/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_buffering off;
}

location /cta-api/ {
    proxy_pass http://127.0.0.1:18201/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_buffering off;
}

location = /manager {
    return 301 /manager/;
}

# Hashed assets must 404 when missing. Falling back to index.html makes
# stale cached HTML load HTML-as-JS and blank the app after a release.
location /manager/assets/ {
    root /home/ubuntu/crypto_cta_manager/webroot;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /manager/ {
    root /home/ubuntu/crypto_cta_manager/webroot;
    try_files $uri $uri/ /manager/index.html;
    add_header Cache-Control "no-cache";
}

location = /cta {
    return 301 /manager/;
}

location ~ ^/cta/(.*)$ {
    return 301 /manager/$1$is_args$args;
}

