# SG Manager routes on the existing :4191 gateway.
location /manager/api/ {
    proxy_pass http://127.0.0.1:18201/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    # Historical theory queries also read the target archive and warm Kline gaps.
    proxy_read_timeout 180s;
    proxy_buffering off;
    gzip on;
    gzip_vary on;
    gzip_types application/json;
}

location /cta-api/ {
    proxy_pass http://127.0.0.1:18201/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 180s;
    proxy_buffering off;
    gzip on;
    gzip_vary on;
    gzip_types application/json;
}

location = /manager {
    return 301 /manager/;
}

# Hashed assets must 404 when missing. Falling back to index.html makes
# stale cached HTML load HTML-as-JS and blank the app after a release.
location /manager/assets/ {
    root /home/ubuntu/crypto_cta_manager/webroot;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css;
}

location /manager/ {
    root /home/ubuntu/crypto_cta_manager/webroot;
    try_files $uri $uri/ /manager/index.html;
    add_header Cache-Control "no-cache";
}

