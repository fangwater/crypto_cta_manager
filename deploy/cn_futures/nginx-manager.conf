# Include inside the existing cloud HTTP server. Preserve /manager/ for the
# native frontend and API mounted by cn_futures_web over the reverse SSH tunnel.
location = /manager {
    return 302 /manager/;
}

location /manager/ {
    proxy_pass http://127.0.0.1:18211;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
