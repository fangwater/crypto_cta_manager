[package]
name = "crypto_cta_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
flate2 = "1"
arrow-array = "59.1.0"
arrow-ipc = { version = "59.1.0", features = ["zstd"] }
arrow-schema = "59.1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
iceoryx2 = "0.8.1"
rocksdb = { version = "0.25", default-features = false, features = ["lz4"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
# Immutable SQL allocation fingerprints retain this parser's original semantics.
# FIFO state uses the exact binary codec below, independently of JSON features.
serde_json = "1"
rmp-serde = "1.3"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
im = { version = "15.1.0", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
